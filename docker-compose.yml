services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: varda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: varda
      RUSTFS_SECRET_KEY: varda-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # RustFS sends no CORS headers unless asked; MinIO allowed every origin
      # out of the box. The browser uploads straight here with a presigned
      # POST, so without this the preflight fails. Wildcard mode refuses
      # credentialed requests, and a presigned POST carries no cookies.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Its own profile on purpose: `up --wait` fails the moment a container in the
  # wait set exits, and this one always does. `pnpm dev` therefore brings the
  # stores up with --wait and runs this after, as
  # `compose --profile storage run --rm rustfs-init` — the storage profile is
  # still needed on that line so the rustfs dependency below resolves.
  rustfs-init:
    image: amazon/aws-cli:2.36.47
    profiles: [storage-init]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: varda
      AWS_SECRET_ACCESS_KEY: varda-secret
      AWS_DEFAULT_REGION: us-east-1
    # Idempotent: create the bucket, or confirm it is already there.
    entrypoint: >-
      /bin/sh -ec "aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket varda ||
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket varda"

volumes:
  postgres-data:
  rustfs-data:
