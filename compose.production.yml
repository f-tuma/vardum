x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgres://varda_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/varda
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  TRANSFORM_SECRET: ${TRANSFORM_SECRET:?set TRANSFORM_SECRET}
  BETTER_AUTH_URL: ${APP_URL:?set APP_URL}
  WEB_URL: ${APP_URL:?set APP_URL}
  CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
  ORGANIZATION_CREATION: ${ORGANIZATION_CREATION:-disabled}
  ORGANIZATION_CREATOR_EMAILS: ${ORGANIZATION_CREATOR_EMAILS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-25}
  UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-200}
  UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-100}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: varda
      POSTGRES_USER: varda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varda -d varda"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Storage is external by default. This profile is for an all-in-one box that
  # has no object store of its own: `docker compose --profile rustfs up -d`.
  rustfs:
    image: rustfs/rustfs:1.0.0
    profiles: [rustfs]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # RustFS sends no CORS headers unless asked, and its PutBucketCors is not
      # dependable yet, so the app's own ensureBucketCors() may not land. The
      # browser uploads here with a presigned POST, so allow the origins at the
      # server instead. Wildcard mode refuses credentialed requests, and a
      # presigned POST carries no cookies.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - production-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.36.47
    profiles: [rustfs]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
    # Idempotent: create the bucket, or confirm it is already there.
    entrypoint: >-
      /bin/sh -ec "aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $$S3_BUCKET ||
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$S3_BUCKET"

  migrate:
    image: vardum-api:${VARDUM_VERSION:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://varda:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/varda
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: vardum-api:${VARDUM_VERSION:-local}
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: vardum-api:${VARDUM_VERSION:-local}
    environment: *app-environment
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    image: vardum-gateway:${VARDUM_VERSION:-local}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      args:
        # The origin the browser POSTs an upload to. It follows
        # S3_PUBLIC_ENDPOINT unless the provider builds a bucket-prefixed host,
        # as AWS does, in which case set VITE_UPLOAD_ORIGINS to that host.
        VITE_UPLOAD_ORIGINS: ${VITE_UPLOAD_ORIGINS:-${S3_PUBLIC_ENDPOINT:-}}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  production-postgres-data:
  production-rustfs-data:
