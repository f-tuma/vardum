# Vardum — the full production stack on Dokploy.
#
# Traefik already terminates TLS, so nginx serves plain HTTP inside Docker and
# owns the /api, /w and web-client split from docker/nginx.marketing.conf.template.
#
# Expose one Dokploy Domain in the UI: your hostname on service `gateway`,
# container port 80. Never expose api, worker or postgres. Objects live in a
# bucket you bring, so there is no storage service to publish.
#
# An optional marketing site is its own Dokploy application
# on dokploy-network with no domain of its own. Point MARKETING_UPSTREAM at its
# service alias; nginx proxies `/` there and keeps /app/ for the product. Until
# that application exists, leave it unset and the apex redirects to /app/.
#
# Required environment (paste .env.dokploy.example into the Dokploy editor):
#   APP_URL=https://vardum.example.com
#   BETTER_AUTH_SECRET=...             (openssl rand -base64 32)
#   TRANSFORM_SECRET=...               (a second, different secret)
#   POSTGRES_PASSWORD=...              (URL-safe: it is embedded in DATABASE_URL)
#   POSTGRES_APP_PASSWORD=...          (different URL-safe secret, 24+ characters)
#   S3_BUCKET / S3_REGION / S3_ENDPOINT / S3_PUBLIC_ENDPOINT
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
#
# Optional:
#   MARKETING_UPSTREAM=vardum-marketing:80
#   COMPOSE_PROFILES=rustfs            (run an object store in the stack and
#                                      give it its own Domain on port 9000)
#
# Use Dokploy Compose mode (not Docker Stack). See docs/dokploy.md for first
# install, optional storage and the stopped-writer upgrade/backup procedure.

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgres://varda_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/varda
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  TRANSFORM_SECRET: ${TRANSFORM_SECRET:?set TRANSFORM_SECRET}
  BETTER_AUTH_URL: ${APP_URL:?set APP_URL}
  WEB_URL: ${APP_URL:?set APP_URL}
  CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
  ORGANIZATION_CREATION: ${ORGANIZATION_CREATION:-allowlist}
  ORGANIZATION_CREATOR_EMAILS: ${ORGANIZATION_CREATOR_EMAILS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-25}
  UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-200}
  UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-100}
  WORKSPACE_STORAGE_MB: ${WORKSPACE_STORAGE_MB:-10240}
  WORKSPACE_PENDING_UPLOADS: ${WORKSPACE_PENDING_UPLOADS:-100}
  UPLOAD_PENDING_HOURS: ${UPLOAD_PENDING_HOURS:-24}
  API_MAX_INFLIGHT: ${API_MAX_INFLIGHT:-128}
  DELIVERY_MAX_INFLIGHT: ${DELIVERY_MAX_INFLIGHT:-64}
  DELIVERY_REQUESTS_PER_SECOND: ${DELIVERY_REQUESTS_PER_SECOND:-100}
  TRANSFORM_CONCURRENCY: ${TRANSFORM_CONCURRENCY:-2}
  TRANSFORM_QUEUE_LIMIT: ${TRANSFORM_QUEUE_LIMIT:-8}
  TRANSFORM_MAX_OUTPUT_PIXELS: ${TRANSFORM_MAX_OUTPUT_PIXELS:-16000000}
  TRANSFORM_TIMEOUT_SECONDS: ${TRANSFORM_TIMEOUT_SECONDS:-15}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: varda
      POSTGRES_USER: varda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dokploy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varda -d varda"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Storage is external by default. Set COMPOSE_PROFILES=rustfs in the Dokploy
  # environment to run one in the stack instead, and give it its own Domain.
  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    profiles: [rustfs]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # No server-side domain config: RustFS is path-style by default, which is
      # what S3_FORCE_PATH_STYLE=true asks for, and the app already signs the
      # presigned POST against S3_PUBLIC_ENDPOINT itself. RUSTFS_SERVER_DOMAINS
      # would switch this host to virtual-host style and break that.
      # RustFS sends no CORS headers unless asked, and its PutBucketCors is not
      # dependable yet, so the app's own ensureBucketCors() may not land. The
      # browser uploads here with a presigned POST, so allow the origins at the
      # server instead. Wildcard mode refuses credentialed requests, and a
      # presigned POST carries no cookies.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - dokploy-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Give only the S3 API port a public Domain. The console has no host port
    # or public router; other trusted peers on dokploy-network can still reach it.
    expose:
      - "9000"
      - "9001"
    networks:
      dokploy-network:
        aliases:
          - vardum-rustfs
      default: {}
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.36.47
    profiles: [rustfs]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
    # Idempotent: create the bucket, or confirm it is already there.
    entrypoint: >-
      /bin/sh -ec "aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $$S3_BUCKET ||
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$S3_BUCKET"

  migrate:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    image: ${COMPOSE_PROJECT_NAME}-api:${VARDUM_VERSION:-dokploy}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://varda:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/varda
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPU_LIMIT:-2}
    image: ${COMPOSE_PROJECT_NAME}-api:${VARDUM_VERSION:-dokploy}
    environment:
      <<: *app-environment
      MONITORING_TOKEN: ${MONITORING_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "3000"
    networks:
      # App traffic never leaves the project network: nginx reaches the API by
      # this alias, and nothing else needs to.
      default:
        aliases:
          - vardum-api-internal
    restart: unless-stopped

  worker:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    cpus: ${WORKER_CPU_LIMIT:-1}
    image: ${COMPOSE_PROJECT_NAME}-api:${VARDUM_VERSION:-dokploy}
    environment: *app-environment
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/worker-healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    image: ${COMPOSE_PROJECT_NAME}-gateway:${VARDUM_VERSION:-dokploy}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      target: dokploy
      args:
        VITE_UPLOAD_ORIGINS: ${VITE_UPLOAD_ORIGINS:-${S3_PUBLIC_ENDPOINT:-}}
    environment:
      API_UPSTREAM: vardum-api-internal:3000
      # Unset until marketing exists: the loopback fallback redirects the apex
      # to /app/, so a missing marketing alias cannot block app startup.
      MARKETING_UPSTREAM: ${MARKETING_UPSTREAM:-127.0.0.1:8080}
    # The Dokploy image includes its template; no checkout bind mount is needed.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # /app/, not /, so the probe fails on a broken client rather than on a
      # marketing site that happens to be redeploying.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/app/"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "80"
    networks:
      # dokploy-network for Traefik on the way in, and for the marketing
      # deployment on the way out.
      dokploy-network: {}
      default: {}
    restart: unless-stopped

volumes:
  dokploy-postgres-data:
  dokploy-rustfs-data:

networks:
  dokploy-network:
    external: true
