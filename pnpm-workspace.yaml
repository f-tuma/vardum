packages:
  - apps/*
  - packages/*

overrides:
  # drizzle-kit still pulls the deprecated loader's esbuild 0.18 (GHSA-67mh-4wv8-2f99).
  # Match drizzle-kit's supported esbuild line; recheck/remove when the loader is dropped.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@smithy/core": "3.31.1"
  "@smithy/fetch-http-handler": "5.6.13"
  "@smithy/node-http-handler": "4.9.13"
  "@smithy/types": "4.16.1"
  "@types/pg": "8.20.0"
  "jose": "6.2.8"
  "nanostores": "1.4.2"
  "rolldown": "1.2.4"
  "semver": "7.8.5"

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@better-auth/api-key@1.7.1"
  - "@better-auth/core@1.7.1"
  - "@better-auth/drizzle-adapter@1.7.1"
  - "@better-auth/telemetry@1.7.1"
  - "auth@1.7.1"
  - "better-auth@1.7.1"
trustPolicy: no-downgrade

# Unused optional peers of drizzle-orm/better-auth (this project uses drizzle
# on pg); esbuild ships per-platform binaries and needs no postinstall.
allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: false
