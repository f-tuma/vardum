packages:
  - apps/*
  - packages/*

overrides:
  # drizzle-kit still pulls the deprecated loader's esbuild 0.18 (GHSA-67mh-4wv8-2f99).
  # Match drizzle-kit's supported esbuild line; recheck/remove when the loader is dropped.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@smithy/core": "3.31.1"
  "@smithy/fetch-http-handler": "5.6.13"
  "@smithy/node-http-handler": "4.9.13"
  "@smithy/types": "4.16.1"
  "@types/pg": "8.20.0"
  "jose": "6.2.8"
  "nanostores": "1.4.2"
  "rolldown": "1.2.4"
  "semver": "7.8.5"

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@better-auth/api-key@1.7.1"
  - "@better-auth/core@1.7.1"
  - "@better-auth/drizzle-adapter@1.7.1"
  - "@better-auth/telemetry@1.7.1"
  - "auth@1.7.1"
  - "better-auth@1.7.1"
  # VARD-52: exact security releases bypass the seven-day age gate only.
  # https://github.com/lovell/sharp/security/advisories/GHSA-wq5f-xc86-pv6w
  - "sharp@0.35.5"
  - "@img/sharp-darwin-arm64@0.35.5"
  - "@img/sharp-darwin-x64@0.35.5"
  - "@img/sharp-freebsd-wasm32@0.35.5"
  - "@img/sharp-linux-arm@0.35.5"
  - "@img/sharp-linux-arm64@0.35.5"
  - "@img/sharp-linux-ppc64@0.35.5"
  - "@img/sharp-linux-riscv64@0.35.5"
  - "@img/sharp-linux-s390x@0.35.5"
  - "@img/sharp-linux-x64@0.35.5"
  - "@img/sharp-linuxmusl-arm64@0.35.5"
  - "@img/sharp-linuxmusl-x64@0.35.5"
  - "@img/sharp-wasm32@0.35.5"
  - "@img/sharp-webcontainers-wasm32@0.35.5"
  - "@img/sharp-win32-arm64@0.35.5"
  - "@img/sharp-win32-ia32@0.35.5"
  - "@img/sharp-win32-x64@0.35.5"
  - "@img/sharp-libvips-darwin-arm64@1.3.4"
  - "@img/sharp-libvips-darwin-x64@1.3.4"
  - "@img/sharp-libvips-linux-arm@1.3.4"
  - "@img/sharp-libvips-linux-arm64@1.3.4"
  - "@img/sharp-libvips-linux-ppc64@1.3.4"
  - "@img/sharp-libvips-linux-riscv64@1.3.4"
  - "@img/sharp-libvips-linux-s390x@1.3.4"
  - "@img/sharp-libvips-linux-x64@1.3.4"
  - "@img/sharp-libvips-linuxmusl-arm64@1.3.4"
  - "@img/sharp-libvips-linuxmusl-x64@1.3.4"
trustPolicy: no-downgrade

# Unused optional peers of drizzle-orm/better-auth (this project uses drizzle
# on pg); esbuild ships per-platform binaries and needs no postinstall.
allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: false
