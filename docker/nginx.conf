# Docker DNS changes when an API container is replaced. Nginx 1.27.3+ supports
# resolving upstream peers at runtime while retaining the original request URI.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream vardum_api {
  zone vardum_api 64k;
  server api:3000 resolve;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # Keep URI-less proxy_pass: encoded delivery paths and signed queries must
  # reach the API byte-for-byte, including the bare reserved prefixes.
  location ~ ^/api(?:/|$) {
    proxy_pass http://vardum_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(?:v|w|assets)(?:/|$) {
    proxy_pass http://vardum_api;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://vardum_api;
  }

  location = /ready {
    proxy_pass http://vardum_api;
  }

  location = /app {
    return 307 /app/$is_args$args;
  }

  # $request_uri retains the original escaping and query. These temporary,
  # relative redirects also work behind a TLS-terminating reverse proxy.
  location ~ ^/(?:account|organizations|workspaces|reset-password|accept-invitation|cli-login)(?:/|$) {
    return 307 /app$request_uri;
  }

  # Missing app files must never fall through to HTML or the marketing site.
  location = /app/assets {
    return 404;
  }

  location ^~ /app/assets/ {
    try_files $uri =404;
  }

  location = /app/favicon.svg {
    try_files $uri =404;
  }

  location /app/ {
    try_files $uri /app/index.html;
  }

  location = / {
    return 307 /app/$is_args$args;
  }

  location / {
    return 404;
  }
}
