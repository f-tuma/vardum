# Docker DNS changes when an API container is replaced. Nginx 1.27.3+ supports
# resolving upstream peers at runtime while retaining the original request URI.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream vardum_api {
  zone vardum_api 64k;
  server api:3000 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://vardum_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(?:v|w)/ {
    proxy_pass http://vardum_api;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /assets/ {
    try_files $uri @legacy_assets;
  }

  location @legacy_assets {
    proxy_pass http://vardum_api;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://vardum_api;
  }

  location = /ready {
    proxy_pass http://vardum_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
