name: Server candidate validation

# Explicit preparation/acceptance only. No PR trigger, tag, publisher, OIDC or deploy.
# Normal CI runs the candidate verifier/projection fixtures through scripts/*.test.mjs.
on:
    workflow_dispatch:
        inputs:
            api_runtime:
                description: API runtime candidate (Node26 is Current; testing only)
                type: choice
                required: true
                default: node22
                options: [node22, node26]

permissions:
    contents: read

concurrency:
    group: server-candidate-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.23.4
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --audit-level=moderate
            - run: pnpm test
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm build
            - name: Check auth, runtime role and private delivery
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y postgresql
                  PG_BINDIR="$(pg_config --bindir)" node --import tsx --test apps/api/integration/*.test.ts
            - name: Validate operational alert rules
              run: docker run --rm -v "$PWD/docker/monitoring:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
            - name: Prepare each server runtime once and save the portable bundle locally
              env:
                  API_RUNTIME_PROFILE: ${{ inputs.api_runtime }}
              run: node scripts/server-candidate.mjs prepare artifacts/server --api-runtime "$API_RUNTIME_PROFILE"
            - name: Check clean candidate source identity
              run: node scripts/server-candidate.mjs check artifacts/server --require-clean --expected-commit "$GITHUB_SHA"
            - name: Accept the exact saved images with public compatibility clients and restore
              env:
                  SMOKE_IMAGE_REPORT_DIR: ${{ runner.temp }}/vardum-server-runtime
              run: SMOKE_SERVER_CANDIDATE="$PWD/artifacts/server" bash scripts/smoke-production.sh
            - name: Confirm the portable bundle remained unchanged
              run: node scripts/server-candidate.mjs check artifacts/server --require-clean --expected-commit "$GITHUB_SHA"
            - name: Prepare field-allowlisted identity and acceptance evidence
              if: always()
              env:
                  ACCEPTANCE_STATUS: ${{ job.status }}
              run: >-
                  node scripts/server-candidate-evidence.mjs artifacts/server
                  "${{ runner.temp }}/vardum-server-runtime"
                  "${{ runner.temp }}/vardum-server-sanitized"
                  --expected-commit "$GITHUB_SHA" --acceptance-status "$ACCEPTANCE_STATUS"
            - name: Retain only the named sanitized reports and hashes
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: server-evidence-${{ github.sha }}-linux-amd64
                  path: |
                      ${{ runner.temp }}/vardum-server-sanitized/candidate-summary.json
                      ${{ runner.temp }}/vardum-server-sanitized/acceptance-summary.json
                      ${{ runner.temp }}/vardum-server-sanitized/checksums.txt
                  if-no-files-found: warn
                  retention-days: 30
