name: Release

# Source releases publish from a matching tag. Retained validation never publishes.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            release_mode:
                description: Validate fresh source archives or a reviewed retained release
                type: choice
                options: [source, retained]
                default: source
            retained_candidate:
                description: Reviewed retained-release descriptor (IDs and hashes are not inputs)
                type: choice
                options: [vard68-upload-import-v1]
                default: vard68-upload-import-v1
            validation_only:
                description: Test release archives and their download without publishing
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: npm-release
    cancel-in-progress: false

jobs:
    validate:
        if: github.event_name == 'push' || inputs.release_mode == 'source'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            expected_ref: ${{ steps.policy.outputs.expected_ref }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.23.3
            - name: Require the release tag or explicit validation-only dispatch
              id: policy
              run: node scripts/release-policy.mjs validate
              env:
                  RELEASE_VALIDATION_ONLY: ${{ inputs.validation_only }}
            - run: pnpm install --frozen-lockfile
            - name: Check dependency advisories before publication
              run: pnpm audit --audit-level=moderate
            - run: pnpm test
            - run: pnpm typecheck
            - run: pnpm build
            - name: Validate operational alert rules
              run: docker run --rm -v "$PWD/docker/monitoring:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
            - name: Check auth, runtime database role and private delivery
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y postgresql
                  PG_BINDIR="$(pg_config --bindir)" node --import tsx --test apps/api/integration/*.test.ts
            - name: Prepare immutable package candidates
              run: node scripts/release-packages.mjs pack artifacts/npm
            - run: bash scripts/smoke-publish.sh artifacts/npm
            - name: Exercise installed packages, production services and backup restore
              id: production_smoke
              env:
                  SMOKE_IMAGE_REPORT_DIR: ${{ runner.temp }}/vardum-runtime-images
              run: SMOKE_RELEASE_DIR="$PWD/artifacts/npm" bash scripts/smoke-production.sh
            - name: Prepare field-allowlisted runtime evidence
              id: runtime_evidence
              if: always()
              continue-on-error: true # Evidence collection does not change acceptance/publication policy.
              env:
                  ACCEPTANCE_STATUS: ${{ steps.production_smoke.outcome }}
                  JOB_STATUS: ${{ job.status }}
              run: >-
                  node scripts/runtime-evidence.mjs
                  "${{ runner.temp }}/vardum-runtime-images"
                  "${{ runner.temp }}/vardum-runtime-sanitized"
                  --expected-commit "$GITHUB_SHA"
                  --acceptance-status "$ACCEPTANCE_STATUS" --job-status "$JOB_STATUS"
            - name: Retain only named sanitized runtime reports and checksums
              if: always() && steps.runtime_evidence.outcome == 'success'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: runtime-image-evidence
                  retention-days: 7
                  if-no-files-found: warn
                  path: |
                      ${{ runner.temp }}/vardum-runtime-sanitized/runtime-summary.json
                      ${{ runner.temp }}/vardum-runtime-sanitized/runtime-summary.txt
                      ${{ runner.temp }}/vardum-runtime-sanitized/checksums.txt
            - name: Preserve the exact tested archives
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: npm-${{ github.sha }}
                  path: |
                      artifacts/npm/release.json
                      artifacts/npm/vardum-shared-*.tgz
                      artifacts/npm/vardum-cli-*.tgz
                      artifacts/npm/vardum-mcp-*.tgz
                  if-no-files-found: error
                  retention-days: 30

    validate-download:
        needs: validate
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'source' && inputs.validation_only == true
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.23.3
            - name: Download the validated archives from this run
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: npm-${{ github.sha }}
                  path: artifacts/npm/
            - name: Verify the downloaded archive manifests and hashes
              run: node scripts/release-packages.mjs check artifacts/npm
            - name: Check independent installs from the downloaded archives
              run: bash scripts/smoke-publish.sh artifacts/npm

    retained-validate:
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'retained'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
            actions: read # Origin attempt metadata and retained artifact download
        env:
            RETAINED_CANDIDATE: ${{ inputs.retained_candidate }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.23.3
            - name: Require safe retained validation mode
              env:
                  RELEASE_VALIDATION_ONLY: ${{ inputs.validation_only }}
              run: node scripts/retained-release.mjs policy "$RETAINED_CANDIDATE"
            - name: Verify origin and download exact reviewed archives
              id: retained_download
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/retained-release.mjs download "$RETAINED_CANDIDATE" artifacts/npm
            - name: Independently install CLI and MCP with transitive shared resolution
              id: retained_installs
              run: node scripts/retained-release.mjs smoke "$RETAINED_CANDIDATE" artifacts/npm
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - run: pnpm install --frozen-lockfile
            - name: Build controller API test dependency (does not build candidate archives)
              run: pnpm --filter @vardum/shared build
            - name: Exercise installed candidate upload and import against the controller API
              id: retained_integration
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y postgresql
                  PG_BINDIR="$(pg_config --bindir)" node scripts/retained-release.mjs integration "$RETAINED_CANDIDATE" artifacts/npm
            - name: Prepare field-allowlisted retained evidence
              id: retained_evidence
              if: always()
              continue-on-error: true
              env:
                  DOWNLOAD_STATUS: ${{ steps.retained_download.outcome }}
                  INSTALL_STATUS: ${{ steps.retained_installs.outcome }}
                  INTEGRATION_STATUS: ${{ steps.retained_integration.outcome }}
              run: node scripts/retained-release.mjs evidence "$RETAINED_CANDIDATE" "${{ runner.temp }}/vardum-retained-sanitized"
            - name: Retain only named sanitized reports and checksums
              if: always() && steps.retained_evidence.outcome == 'success'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: retained-validation-evidence
                  retention-days: 7
                  if-no-files-found: error
                  path: |
                      ${{ runner.temp }}/vardum-retained-sanitized/retained-summary.json
                      ${{ runner.temp }}/vardum-retained-sanitized/retained-summary.txt
                      ${{ runner.temp }}/vardum-retained-sanitized/checksums.txt
            - name: Preserve only the four original npm files
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: retained-npm-${{ inputs.retained_candidate }}
                  retention-days: 30
                  if-no-files-found: error
                  path: |
                      artifacts/npm/release.json
                      artifacts/npm/vardum-shared-0.3.0.tgz
                      artifacts/npm/vardum-cli-0.7.0.tgz
                      artifacts/npm/vardum-mcp-0.3.0.tgz

    publish:
        needs: validate
        if: >-
            (github.event_name == 'push' || inputs.release_mode == 'source') &&
            needs.validate.outputs.expected_ref == github.ref &&
            (github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.validation_only == false))
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: npm
        permissions:
            contents: write # GitHub release and its archives
            id-token: write # npm trusted publishing, only in this job
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.23.3
                  registry-url: https://registry.npmjs.org
            - name: Independently require publication from the matching CLI tag
              run: node scripts/release-policy.mjs publish
              env:
                  RELEASE_VALIDATION_ONLY: ${{ inputs.validation_only }}
            - name: Use the tested npm version with OIDC support
              run: npm install --global npm@12.0.2
            - name: Download the validated archives from this run
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: npm-${{ github.sha }}
                  path: artifacts/npm/
            - name: Publish the tested archives in dependency order
              run: node scripts/release-packages.mjs publish artifacts/npm
              env:
                  # npm provenance is unsupported for private source repositories.
                  NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
            - name: Verify registry integrity and independent npm installs
              run: node scripts/release-packages.mjs verify-registry artifacts/npm
            - name: Create or verify the GitHub release with the published archives
              run: node scripts/github-release.mjs artifacts/npm
              env:
                  GH_TOKEN: ${{ github.token }}
