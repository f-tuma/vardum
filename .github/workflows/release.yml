name: Release

# Only a version tag can publish. Manual dispatch can retry that same tag.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: npm-release
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - name: Require the matching CLI release tag
              run: node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("apps/cli/package.json")).version; if (process.env.GITHUB_REF !== `refs/tags/v${v}`) throw new Error(`Run this release from tag v${v}`);'
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.23.2
            - run: pnpm install --frozen-lockfile
            - name: Check dependency advisories before publication
              run: pnpm audit --audit-level=moderate
            - run: pnpm test
            - run: pnpm typecheck
            - run: pnpm build
            - name: Validate operational alert rules
              run: docker run --rm -v "$PWD/docker/monitoring:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
            - name: Check auth, runtime database role and private delivery
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y postgresql
                  PG_BINDIR="$(pg_config --bindir)" node --import tsx --test apps/api/integration/*.test.ts
            - name: Prepare immutable package candidates
              run: node scripts/release-packages.mjs pack artifacts/npm
            - run: bash scripts/smoke-publish.sh artifacts/npm
            - name: Exercise installed CLI and every MCP tool against production services
              run: SMOKE_RELEASE_DIR="$PWD/artifacts/npm" bash scripts/smoke-production.sh
            - name: Preserve the exact tested archives
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: npm-${{ github.sha }}
                  path: artifacts/npm/
                  if-no-files-found: error
                  retention-days: 30

    publish:
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm
        permissions:
            contents: write # GitHub release and its archives
            id-token: write # npm trusted publishing, only in this job
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.23.2
                  registry-url: https://registry.npmjs.org
            - name: Use the tested npm version with OIDC support
              run: npm install --global npm@12.0.2
            - name: Download the validated archives from this run
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: npm-${{ github.sha }}
                  path: artifacts/npm/
            - name: Publish the tested archives in dependency order
              run: node scripts/release-packages.mjs publish artifacts/npm
              env:
                  # npm provenance is unsupported for private source repositories.
                  NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
            - name: Verify registry integrity and independent npm installs
              run: node scripts/release-packages.mjs verify-registry artifacts/npm
            - name: Create the GitHub release with the published archives
              run: |
                  if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release create "$GITHUB_REF_NAME" artifacts/npm/* --generate-notes --verify-tag
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
