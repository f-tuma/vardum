name: Release

# Publishing is triggered by pushing a version tag, so a release is a
# deliberate act with a record in git. Nothing runs on ordinary pushes.
on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write # create the GitHub release
    id-token: write # npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: npm
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.32.1
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: pnpm typecheck
            - run: pnpm build
            - run: bash scripts/smoke-publish.sh
            # pnpm walks the workspace in dependency order and skips any version
            # already on the registry, so one tag releases whatever changed.
            - run: pnpm -r publish --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: "true"
            - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ github.token }}
