name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.23.3
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Check dependency advisories (including build tools)
              run: pnpm audit --audit-level=moderate
            - run: pnpm test
            - name: Install PostgreSQL for isolated auth regression tests
              run: sudo apt-get update -qq && sudo apt-get install -y postgresql
            - name: Check organization email verification
              run: PG_BINDIR="$(pg_config --bindir)" pnpm --filter @vardum/api test:organization-verification
            - name: Check runtime database privileges and workspace isolation
              run: PG_BINDIR="$(pg_config --bindir)" pnpm --filter @vardum/api test:runtime-database
            - name: Check private delivery with the production database role
              run: PG_BINDIR="$(pg_config --bindir)" pnpm --filter @vardum/api test:private-delivery
            - name: Check asset pagination with real auth and workspace isolation
              run: PG_BINDIR="$(pg_config --bindir)" pnpm --filter @vardum/api test:asset-pagination
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm build
            - name: Validate operational alert rules
              run: docker run --rm -v "$PWD/docker/monitoring:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
            - run: pnpm check:compose
            - run: bash scripts/smoke-publish.sh
            - name: Check production services and clean-stack backup restore
              env:
                  SMOKE_IMAGE_REPORT_DIR: ${{ runner.temp }}/vardum-runtime-images
              run: bash scripts/smoke-production.sh
            - name: Retain runtime image findings and checksums
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: runtime-image-evidence
                  retention-days: 7
                  if-no-files-found: warn
                  path: |
                      ${{ runner.temp }}/vardum-runtime-images/*.json
                      ${{ runner.temp }}/vardum-runtime-images/*.txt
                      ${{ runner.temp }}/vardum-runtime-images/gateway-config/*.json
                      ${{ runner.temp }}/vardum-runtime-images/gateway-config/*.txt
                      ${{ runner.temp }}/vardum-runtime-images/dokploy-gateway-config/*.json
                      ${{ runner.temp }}/vardum-runtime-images/dokploy-gateway-config/*.txt
                      ${{ runner.temp }}/vardum-runtime-images/runtime-tls/*.json
                      ${{ runner.temp }}/vardum-runtime-images/runtime-tls/*.txt
